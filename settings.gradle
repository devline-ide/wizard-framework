
rootProject.name = 'framework'

include 'wizard-core'
include 'wizard-core-legacy'
include 'wizard-browser'
include 'wizard-browser-fx'
include 'wizard-browser-win32'
include 'wizard-browser-win64'
include 'wizard-browser-linux64'
include 'wizard-web'
include 'wizard-web-ui'
include ':wizard-web-ui:components:ace-editor'
project(':wizard-web-ui:components:ace-editor').projectDir = file('wizard-web-ui/components/ace-editor')
include ':wizard-web-ui:components:slider'
project(':wizard-web-ui:components:slider').projectDir = file('wizard-web-ui/components/slider')
include ':wizard-web-ui:components:craft-game-engine'
project(':wizard-web-ui:components:craft-game-engine').projectDir = file('wizard-web-ui/components/craft-game-engine')

include 'wizard-app'
include 'wizard-app-web'
include 'wizard-app-desktop'

include 'sandbox-web'
include 'sandbox-desktop'
include 'sandbox-browser'

// modules.

file("$rootDir.path/modules").listFiles().each { moduleDir ->
    if (moduleDir.directory && moduleDir.name.startsWith('wizard-')) {
        def projectPath = ":modules:${moduleDir.name}"
        include projectPath
        project(projectPath).projectDir = moduleDir
    }
}

