buildscript {
    ext {
        projectGroup = "org.develnext.framework"
        projectVersion = "1.0.0"

        jphpVersion = "0.9.3-SNAPSHOT"
        javaVersion = JavaVersion.VERSION_25
        junitVersion = "4.12"
    }
}

def sourceRepository = file(System.getProperty(
        'maven.repo.local',
        new File(rootDir, '../../.gradle/source-repo').absolutePath
))

allprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    group = projectGroup
    version = Boolean.getBoolean('release') ? projectVersion : "${projectVersion}-SNAPSHOT"

    java {
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = 'UTF-8'
    }

    repositories {
        maven {
            name = 'devlineSource'
            url = sourceRepository.toURI()
        }
        mavenCentral()
    }

    sourceSets {
        main.resources.srcDirs = ['src-php', 'resources']
    }

    dependencies {
        testImplementation "junit:junit:${junitVersion}"
    }
}

subprojects {
    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java
            }
        }
        repositories {
            maven {
                name = 'devlineSource'
                url = sourceRepository.toURI()
            }
        }
    }
}

def sourceModules = [
        ':wizard-core',
        ':wizard-web',
        ':wizard-web-ui',
        ':wizard-app',
        ':wizard-app-web',
        ':modules:wizard-localization',
        ':modules:wizard-httpclient',
        ':modules:wizard-ide-support'
]

tasks.register('publishSource') {
    group = 'publishing'
    description = 'Publishes the Wizard artifacts used by DevLine to the workspace source repository.'
    dependsOn sourceModules.collect { "${it}:publishMavenJavaPublicationToDevlineSourceRepository" }
}

tasks.wrapper {
    gradleVersion = '9.7.1'
    distributionType = Wrapper.DistributionType.ALL
}
