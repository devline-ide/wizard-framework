apply plugin: 'application'

application {
    mainClass = 'php.runtime.launcher.Launcher'
    applicationDefaultJvmArgs = ['-Dfile.encoding=UTF-8']
}

dependencies {
    implementation project(":wizard-app-web")
    implementation project(":modules:wizard-ide-support")
    implementation project(":modules:wizard-httpclient")
    implementation "org.develnext.jphp:jphp-core:${jphpVersion}"
    implementation "org.develnext.jphp:jphp-zend-ext:${jphpVersion}"
    implementation "org.develnext.jphp:jphp-yaml-ext:${jphpVersion}"
    implementation "org.develnext.jphp:jphp-xml-ext:${jphpVersion}"
    implementation "org.develnext.jphp:jphp-jsoup-ext:${jphpVersion}"
}

task webSandbox(dependsOn: ['run']) {

}
